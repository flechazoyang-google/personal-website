# nginx 站点配置：yghsite.cn / www.yghsite.cn
#
# 部署位置：/etc/nginx/sites-available/personal-website
#           软链到 /etc/nginx/sites-enabled/personal-website
# 证书：certbot --nginx -d yghsite.cn -d www.yghsite.cn --redirect
#       （下面 443 与 80 跳转段落由 certbot 自动追加/维护）
server {
    server_name yghsite.cn www.yghsite.cn;

    root /var/www/personal-website;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/personal-website.access.log;
    error_log  /var/log/nginx/personal-website.error.log;

    # projects.json 由 GitHub Action 每 6 小时更新，短缓存即可
    location = /projects.json {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不暴露隐藏文件
    location ~ /\. { deny all; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yghsite.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yghsite.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.yghsite.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = yghsite.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name yghsite.cn www.yghsite.cn;
    return 404; # managed by Certbot
}
