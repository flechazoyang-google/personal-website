<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>妄司逸 · 作品集</title>
<style>
  :root{--ink:#1a1a1a;--gray:#8a8a8a;--line:#e5e5e5;--paper:#ffffff;--accent:#c2410c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",serif;line-height:1.9;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
  a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .wrap{max-width:900px;margin:0 auto;padding:0 48px;}
  .site-header{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);}
  .logo{font-size:15px;letter-spacing:.35em;font-weight:700;}
  .logo b{color:var(--accent);font-weight:700;}
  .nav-links a{font-size:12px;letter-spacing:.2em;color:var(--gray);text-decoration:none;margin-left:32px;transition:color .3s;}
  .nav-links a:hover{color:var(--ink);}
  .hero-section{padding:120px 0 90px;}
  .hero-eyebrow{font-size:11px;letter-spacing:.4em;color:var(--gray);margin-bottom:28px;}
  .hero-title{font-size:56px;font-weight:300;line-height:1.3;letter-spacing:.08em;}
  .hero-title em{font-style:normal;color:var(--accent);}
  .hero-subtitle{margin-top:26px;font-size:15px;color:var(--gray);max-width:560px;}
  .hero-stats{margin-top:44px;display:flex;gap:56px;font-size:12px;letter-spacing:.18em;color:var(--gray);}
  .hero-stats span b{display:block;color:var(--ink);font-size:22px;font-weight:400;letter-spacing:.05em;margin-top:6px;}
  section{padding:70px 0;border-top:1px solid var(--line);}
  .section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:48px;}
  .section-title{font-size:26px;font-weight:400;letter-spacing:.15em;}
  .section-num{font-size:11px;letter-spacing:.3em;color:var(--gray);}
  .project-card{border-top:1px solid var(--line);padding:40px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px;transition:padding .3s;}
  .project-card:hover{padding-left:16px;}
  .project-card:hover .project-title{color:var(--accent);}
  .project-title{font-size:22px;font-weight:500;letter-spacing:.06em;transition:color .3s;}
  .project-tech{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;width:100%;}
  .project-tech span{font-size:11px;letter-spacing:.1em;color:var(--gray);border:1px solid var(--line);padding:4px 12px;border-radius:99px;}
  .project-desc{font-size:13.5px;color:#555;margin-top:14px;line-height:1.9;width:100%;}
  .project-version{font-family:monospace;font-size:11px;color:var(--accent);background:rgba(194,65,12,.06);padding:2px 8px;border-radius:4px;}
  .project-links{margin-top:14px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;width:100%;}
  .project-links a{display:inline-block;font-size:12px;letter-spacing:.2em;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:2px;margin-right:16px;}
  .project-links a:hover{color:var(--ink);border-color:var(--ink);}
  .about-text p{font-size:14px;color:#555;max-width:640px;margin-bottom:18px;}
  .site-footer{padding:40px 0 60px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.25em;color:var(--gray);display:flex;justify-content:space-between;}
  .dl-widget{display:flex;flex-direction:column;align-items:flex-start;position:relative;margin-left:10px;}
  .dl-widget-row{display:flex;align-items:center;gap:4px;}
  .dl-btn{background:none;border:none;padding:0;cursor:pointer;text-align:left;font:inherit;}
  .dl-btn:hover .dl-label{color:var(--ink);}
  .dl-label{display:block;font-size:12px;letter-spacing:.2em;color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:2px;transition:color .3s,border-color .3s;white-space:nowrap;}
  .dl-ver{font-family:monospace;font-size:10px;color:var(--gray);margin-top:4px;white-space:nowrap;}
  .dl-toggle{background:none;border:none;color:var(--gray);cursor:pointer;font-size:8px;padding:2px;transition:color .2s;}
  .dl-toggle:hover{color:var(--accent);}
  .dl-menu{display:none;position:absolute;top:100%;left:0;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:100;overflow:hidden;min-width:150px;}
  .dl-menu.open{display:block;animation:dlSlide .15s ease-out;}
  .dl-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;text-align:left;transition:background .15s;}
  .dl-menu button:hover{background:rgba(194,65,12,.05);}
  .dl-menu button.active{color:var(--accent);font-weight:600;}
  .dl-menu button.active::before{content:"✓";font-size:10px;}
  .dl-menu button:not(.active)::before{content:"";width:10px;}
  .dl-menu .dl-ch{font-size:9px;color:var(--gray);font-family:monospace;margin-left:auto;}
  @keyframes dlSlide{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  @media(hover:none){
    .project-card:hover{padding-left:0;}
    .project-card:hover .project-title{color:var(--ink);}
    .nav-links a:hover{color:var(--gray);}
    .project-links a:hover{color:var(--accent);border-color:var(--accent);}
    .dl-btn:hover .dl-label{color:var(--accent);}
    .dl-toggle:hover{color:var(--gray);}
    .dl-menu button:hover{background:none;}
  }
  @media(max-width:720px){
    .wrap{padding:0 20px;}
    .site-header{padding:18px 0;}
    .logo{font-size:13px;letter-spacing:.18em;}
    .nav-links a{font-size:11px;margin-left:14px;letter-spacing:.12em;}
    .hero-section{padding:52px 0 36px;}
    .hero-eyebrow{font-size:10px;letter-spacing:.28em;margin-bottom:18px;}
    .hero-title{font-size:27px;letter-spacing:.03em;line-height:1.5;}
    .hero-subtitle{font-size:13px;margin-top:16px;line-height:1.8;}
    .hero-stats{flex-direction:column;align-items:flex-start;gap:14px;margin-top:26px;}
    .hero-stats span b{font-size:17px;margin-top:2px;}
    section{padding:36px 0;}
    .section-header{margin-bottom:24px;flex-direction:column;align-items:flex-start;gap:6px;}
    .section-title{font-size:20px;}
    .section-num{font-size:10px;}
    .project-card{padding:22px 0;gap:6px 8px;transition:none;}
    .project-title{font-size:17px;}
    .project-desc{font-size:13.5px;margin-top:8px;line-height:1.85;}
    .project-tech{margin-top:10px;gap:6px;}
    .project-tech span{font-size:10px;padding:3px 10px;}
    .project-links{margin-top:12px;gap:16px 10px;}
    .project-links a{margin-right:0;}
    .dl-widget{margin-left:0;margin-top:2px;}
    .dl-btn{padding:10px 0;margin:-10px 0;}
    .dl-toggle{padding:10px 8px;margin:-10px -8px;font-size:9px;}
    .dl-menu{position:fixed;top:auto;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));margin:0;min-width:0;border-radius:12px;z-index:200;box-shadow:0 -4px 30px rgba(0,0,0,.14);}
    .dl-menu.open{animation:dlSheet .2s ease-out;}
    .dl-menu::before{content:"选择版本";display:block;padding:12px 16px 8px;font-size:11px;letter-spacing:.15em;color:var(--gray);border-bottom:1px solid var(--line);}
    .dl-menu button{padding:14px 16px;font-size:14px;}
    .dl-menu button.active::before{font-size:12px;}
    .dl-menu .dl-ch{font-size:10px;}
    .about-text p{font-size:13.5px;}
    .site-footer{flex-direction:column;align-items:flex-start;gap:8px;padding:26px 0 40px;font-size:10px;}
  }
  @media(max-width:380px){
    .wrap{padding:0 16px;}
    .hero-title{font-size:24px;}
    .nav-links a{margin-left:10px;}
    .dl-menu{left:12px;right:12px;}
  }
  @keyframes dlSheet{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<header class="site-header wrap">
  <div class="logo">妄<b>司</b>逸 · PORTFOLIO</div>
  <nav class="nav-links"><a href="#projects">项目</a><a href="#about">关于</a></nav>
</header>
<div class="hero-section wrap">
  <div class="hero-eyebrow">ANDROID DEVELOPER — 2026</div>
  <h1 class="hero-title">把想法做成<br>实实在在的<em>作品</em>。</h1>
  <p class="hero-subtitle" data-bind="hero-subtitle"></p>
  <div class="hero-stats" data-bind="hero-stats"></div>
</div>
<section id="projects" class="wrap">
  <div class="section-header"><h2 class="section-title">项目</h2><span class="section-num">SELECTED WORKS</span></div>
  <div class="projects-grid" data-bind="projects"></div>
</section>
<section id="about" class="wrap">
  <div class="section-header"><h2 class="section-title">关于</h2><span class="section-num">ABOUT</span></div>
  <div class="about-text" data-bind="about"></div>
</section>
<footer class="site-footer wrap"><span>© 2026 妄司逸 · 保持简单</span><span>E-MAIL &amp; FEEDBACK WELCOME</span></footer>

<script>
(function () {
  const ICONS = {'coc-war':'⚔️','toolbox':'🧰','blog':'📝'};
  let data = null;

  function versionBadge(p) {
    return `<span class="project-version">${p.version || '未知'}</span>`;
  }

  function linksHtml(p) {
    return p.links.filter(l => !l.download).map(l =>
      `<a href="${l.url}" target="_blank">${l.label}</a>`
    ).join('');
  }

  function downloadWidget(p) {
    const downloads = (p.links || []).filter(l => l.download);
    if (!downloads.length) return '';
    const first = downloads[0];
    const firstVer = first.label.replace(/^(正式版|RC|Beta|Alpha)\s*/, '');
    let menuHtml = downloads.map((d, i) => {
      const ver = d.label.replace(/^(正式版|RC|Beta|Alpha)\s*/, '');
      const ch = d.label.match(/^(正式版|RC|Beta|Alpha)/)?.[1] || '';
      return `<button data-url="${d.url}" data-ver="${ver}" class="${i === 0 ? 'active' : ''}"><span>${ver}</span><span class="dl-ch">${ch}</span></button>`;
    }).join('');
    return `<div class="dl-widget"><div class="dl-widget-row"><button class="dl-btn" data-url="${first.url}"><span class="dl-label">下载</span></button><button class="dl-toggle">▼</button></div><span class="dl-ver">${firstVer}</span><div class="dl-menu">${menuHtml}</div></div>`;
  }

  document.addEventListener('click', e => {
    const widget = e.target.closest('.dl-widget');
    if (!widget) {
      document.querySelectorAll('.dl-menu.open').forEach(m => m.classList.remove('open'));
      return;
    }
    if (e.target.closest('.dl-toggle')) {
      e.preventDefault();
      document.querySelectorAll('.dl-menu.open').forEach(m => {
        if (m.closest('.dl-widget') !== widget) m.classList.remove('open');
      });
      widget.querySelector('.dl-menu').classList.toggle('open');
      return;
    }
    const item = e.target.closest('.dl-menu button');
    if (item) {
      e.stopPropagation();
      widget.querySelector('.dl-btn').dataset.url = item.dataset.url;
      widget.querySelector('.dl-ver').textContent = item.dataset.ver;
      widget.querySelectorAll('.dl-menu button').forEach(b => b.classList.remove('active'));
      item.classList.add('active');
      widget.querySelector('.dl-menu').classList.remove('open');
      return;
    }
    if (e.target.closest('.dl-btn')) {
      e.preventDefault();
      window.open(widget.querySelector('.dl-btn').dataset.url, '_blank');
    }
  });

  function renderProjects(d) {
    document.querySelectorAll('[data-bind="projects"]').forEach(container => {
      container.innerHTML = '';
      d.projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';
        const icon = ICONS[p.id] || '📦';
        card.innerHTML = `<div class="project-icon">${icon}</div><h3 class="project-title">${p.name} ${versionBadge(p)}</h3><p class="project-desc">${p.description}</p><div class="project-tech">${p.tech.map(t => `<span>${t}</span>`).join('')}</div><div class="project-links">${linksHtml(p)}${downloadWidget(p)}</div>`;
        container.appendChild(card);
      });
    });
  }

  function renderHeroStats(d) {
    document.querySelectorAll('[data-bind="hero-stats"]').forEach(el => {
      el.innerHTML = `<span>专注领域<b>Android · Kotlin</b></span><span>作品数量<b>${d.stats.apps} 应用</b></span><span>博客地址<b>blog.flechazo.icu</b></span>`;
    });
  }

  function renderAbout(d) {
    document.querySelectorAll('[data-bind="about"]').forEach(el => {
      el.innerHTML = `<p>${d.about.intro}</p><p>${d.about.philosophy}</p>`;
    });
  }

  function renderFields(d) {
    document.querySelectorAll('[data-bind="hero-subtitle"]').forEach(el => { el.textContent = d.about.intro; });
  }

  function renderAll(d) {
    renderProjects(d);
    renderHeroStats(d);
    renderAbout(d);
    renderFields(d);
  }

  const CDN_RELEASE = 'https://cdn.flechazo.icu/release.json';

  function mergeRelease(d, release) {
    const coc = d.projects.find(p => p.id === 'coc-war');
    if (!coc || !release) return;
    const channels = [
      { key: 'stable', label: '正式版' },
      { key: 'rc', label: 'RC' },
      { key: 'beta', label: 'Beta' },
      { key: 'alpha', label: 'Alpha' }
    ];
    if (release.stable) coc.version = release.stable.version;
    channels.forEach(ch => {
      const r = release[ch.key];
      if (r) coc.links.push({ label: `${ch.label} ${r.version}`, url: r.url, download: true });
    });
  }

  Promise.all([
    fetch('projects.json').then(r => r.json()),
    fetch(CDN_RELEASE).then(r => r.json()).catch(() => null)
  ]).then(([d, release]) => {
    mergeRelease(d, release);
    data = d;
    renderAll(d);
  }).catch(err => { console.error('Failed to load data:', err); });
})();
</script>
</body>
</html>
